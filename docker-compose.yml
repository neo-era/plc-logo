services:
  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "8080:8080"   # REST + WebSocket (đặt sau Caddy/Nginx HTTPS)
      - "1883:1883"   # MQTT plain (chỉ expose nếu gateway kết nối plain — nên dùng TLS)
      - "8883:8883"   # MQTT TLS (cần cert)
    env_file: ./server/.env
    volumes:
      - ./server/data:/app/data
      - ./server/certs:/app/certs:ro   # mount cert TLS nếu dùng

  # Caddy reverse-proxy tự lấy Let's Encrypt cho HTTPS — bật nếu có domain
